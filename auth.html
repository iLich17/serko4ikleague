<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>F1 League — Вход</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07070a;color:#fff;font-family:Arial,Helvetica,sans-serif}.card{width:min(440px,calc(100% - 32px));background:#15151a;border:1px solid #292930;border-radius:18px;padding:28px;box-shadow:0 20px 60px #0008}.logo{text-align:center;font-size:28px;font-weight:950;margin-bottom:8px}.logo span{color:#e10600}.sub{text-align:center;color:#85858d;margin:0 0 24px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#0c0c10;padding:5px;border-radius:10px;margin-bottom:20px}.tab{border:0;background:transparent;color:#888;padding:10px;border-radius:8px;font-weight:800;cursor:pointer}.tab.active{background:#e10600;color:#fff}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:12px;color:#aeb4bd;font-weight:800}.field input{width:100%;background:#0d0d11;color:#fff;border:1px solid #303038;border-radius:10px;padding:13px;font:inherit;outline:none}.btn{width:100%;border:0;background:#e10600;color:#fff;padding:13px;border-radius:10px;font-weight:900;cursor:pointer;margin-top:8px}.msg{min-height:20px;margin-top:14px;text-align:center;font-size:13px}.error{color:#ff716b}.ok{color:#72d28b}.hint{font-size:11px;color:#777;text-align:center;margin-top:14px;line-height:1.5}.hidden{display:none!important}

@media(max-width:600px){
  body{padding:12px}
  .card{width:100%;padding:20px;border-radius:14px}
  .logo{font-size:25px}
  .field input,.btn{min-height:46px}
}
</style></head><body><main class="card"><div class="logo">F1<span>LEAGUE</span></div><p class="sub">Для просмотра сайта нужен аккаунт</p><div class="tabs"><button class="tab active" id="loginTab">Войти</button><button class="tab" id="registerTab">Регистрация</button></div>
<form id="loginForm"><div class="field"><label>Ник</label><input id="loginNick" maxlength="24" autocomplete="username" required></div><div class="field"><label>Пароль</label><input id="loginPass" type="password" autocomplete="current-password" required></div><button class="btn">Войти</button></form>
<form id="registerForm" class="hidden"><div class="field"><label>Ник</label><input id="regNick" maxlength="24" autocomplete="username" required></div><div class="field"><label>Пароль</label><input id="regPass" type="password" minlength="6" maxlength="128" autocomplete="new-password" required></div><div class="field"><label>Повтори пароль</label><input id="regPass2" type="password" minlength="6" maxlength="128" autocomplete="new-password" required></div><button class="btn">Создать аккаунт</button></form><div id="msg" class="msg"></div><div class="hint">Ник: 3–24 символа. Пароль: минимум 6 символов.<br>Данные аккаунта сохраняются на сервере.</div></main>
<script>
const $=id=>document.getElementById(id),msg=$('msg');
function show(mode){$('loginForm').classList.toggle('hidden',mode!=='login');$('registerForm').classList.toggle('hidden',mode!=='register');$('loginTab').classList.toggle('active',mode==='login');$('registerTab').classList.toggle('active',mode==='register');msg.textContent='';msg.className='msg'}
$('loginTab').onclick=()=>show('login');$('registerTab').onclick=()=>show('register');
async function send(url,data){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Ошибка сервера');return d}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{await send('/api/auth/login',{nick:$('loginNick').value,password:$('loginPass').value});msg.textContent='Вход выполнен';msg.className='msg ok';location.href='/'}catch(x){msg.textContent=x.message;msg.className='msg error'}};
$('registerForm').onsubmit=async e=>{e.preventDefault();if($('regPass').value!==$('regPass2').value){msg.textContent='Пароли не совпадают';msg.className='msg error';return}try{await send('/api/auth/register',{nick:$('regNick').value.trim(),password:$('regPass').value});msg.textContent='Аккаунт создан';msg.className='msg ok';setTimeout(()=>location.href='/',250)}catch(x){msg.textContent=x.message;msg.className='msg error'}};
fetch('/api/auth/me').then(r=>r.json()).then(d=>{if(d.authenticated)location.href='/'})
</script></body></html>
